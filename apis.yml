aid: voyceme
name: VoyceMe
description: >-
  VoyceMe (voyce.me) is a North American manga, webtoon, and web-novel creator platform where
  independent creators publish serialized comics and novels and readers discover, follow, comment
  on, and support them, with a merch shop and an engaged creator community. The company also runs
  an AI-character product line — Play Engine and its "storypack"/"storytech" surfaces — for
  world-model-grounded playable characters. VoyceMe operates a public, unauthenticated Hasura
  GraphQL API (graphql.voyce.me) exposing its catalog of series, chapters, panels, users,
  engagement, editorial blog content, and AI chatbots. Backed by 500 Global and Redpoint Ventures.
